<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio</title>

<style>

body{
margin:0;
font-family:Inter, sans-serif;
background:black;
color:white;
scroll-behavior:smooth;
overflow-x:hidden;
}

/* Sections */

.section{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-size:48px;
letter-spacing:-1px;
}

/* Hero */

.hero{
background:black;
position:relative;
}

/* Scroll Arrow */

.arrow{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
font-size:40px;
cursor:pointer;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,20%,50%,80%,100%{transform:translate(-50%,0);}
40%{transform:translate(-50%,-15px);}
60%{transform:translate(-50%,-8px);}
}

/* Floating Menu */

.menu{
position:fixed;
top:30px;
right:30px;
width:50px;
height:50px;
border-radius:50%;
background:#222;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:999;
}

.menu:hover{
background:#555;
}

.panel{
position:fixed;
top:0;
right:-300px;
width:300px;
height:100%;
background:#111;
padding:60px 30px;
transition:0.4s;
}

.panel a{
display:block;
color:white;
text-decoration:none;
margin:20px 0;
font-size:22px;
}

.panel.open{
right:0;
}

</style>
</head>

<body>

<div class="menu" onclick="toggleMenu()">≡</div>

<div class="panel" id="panel">
<a href="#about">About</a>
<a href="#work">Work</a>
<a href="#contact">Contact</a>
</div>

<section class="section hero">
<div>YOUR NAME</div>
<div class="arrow" onclick="scrollDown()">⌄</div>
</section>

<section id="about" class="section" style="background:#111;">
About Section
</section>

<section id="work" class="section" style="background:#181818;">
Work Section
</section>

<section id="contact" class="section" style="background:#222;">
Contact Section
</section>

<script>

function scrollDown(){
window.scrollTo({
top:window.innerHeight,
behavior:'smooth'
});
}

function toggleMenu(){
document.getElementById("panel").classList.toggle("open");
}

</script>

</body>
</html>
