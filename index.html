/* REVEAL */

.reveal{
opacity:0;
transform:translateY(80px);
transition:all 1.2s ease;
}

.reveal.active{
opacity:1;
transform:translateY(0);
}

.case-image{
width:80%;
max-width:900px;
margin:120px auto;
display:block;
border-radius:14px;
box-shadow:0 40px 80px rgba(0,0,0,0.5);
}

/* Sections */

.section{
height:100vh;
display:flex;
align-items:center;
justify-content:center;

</section>

/* Scroll Arrow */

.arrow{
position:absolute;
bottom:40px;
left:50%;
transform:translateX(-50%);
font-size:40px;
cursor:pointer;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,20%,50%,80%,100%{transform:translate(-50%,0);}
40%{transform:translate(-50%,-15px);}
60%{transform:translate(-50%,-8px);}
}

/* Floating Menu */

.menu{
position:fixed;
top:30px;
right:30px;
width:50px;
height:50px;
border-radius:50%;
background:#f5f5f5;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
z-index:999;
}

.menu:hover{
background:#f5f5f5;
}

.panel{
position:fixed;
top:0;
right:-300px;
width:300px;
height:100%;
background:#f5f5f5;
padding:60px 30px;
transition:0.4s;
}

.panel a{
display:block;
color:white;
text-decoration:none;
margin:20px 0;
font-size:22px;
}

.panel.open{

}

<script>
 function scrollToNextSection(el){
let next = el.parentElement.nextElementSibling;
if(next){
next.scrollIntoView({behavior:'smooth'});
}
}

  function scrollToNext(){
window.scrollTo({
top:window.innerHeight,
behavior:'smooth'
});
}

const reveals = document.querySelectorAll(".reveal");

const observer = new IntersectionObserver(entries => {
entries.forEach(entry => {
if(entry.isIntersecting){
entry.target.classList.add("active");
}
});
},{threshold:0.2});

reveals.forEach(el => observer.observe(el));

function scrollDown(){
window.scrollTo({
top:window.innerHeight,
behavior:'smooth'
});
}

function toggleMenu(){
document.getElementById("panel").classList.toggle("open");
}
window.addEventListener("scroll", function(){
let scrolled = window.pageYOffset;
let bg = document.getElementById("bg1");
if(bg){
bg.style.transform = "translateY(" + (scrolled * 0.35) + "px)";
}
});
